<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Macro Monitor — CPI · Jobs · PCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#0a0d11; --panel:#12161c; --panel2:#171c23; --raise:#1c2229;
    --border:#262d37; --border2:#323b47;
    --tx:#e6edf3; --tx2:#9aa7b4; --tx3:#5f6b78;
    --amber:#f5a623; --amber-d:#3a2c12;
    --up:#3fb950; --up-d:#10331b; --down:#f85149; --down-d:#3a1414;
    --info:#58a6ff; --info-d:#11243f; --warn:#d9a441;
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
    --r:8px; --r-lg:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{font-size:14px;line-height:1.5}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--info);text-decoration:none}

  /* ---------- gate ---------- */
  #gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px}
  .gate-card .mark{font-family:var(--mono);font-weight:600;color:var(--amber);letter-spacing:.18em;font-size:11px;text-transform:uppercase}
  .gate-card h1{font-size:18px;font-weight:600;margin:10px 0 4px}
  .gate-card p{color:var(--tx2);font-size:12.5px;margin:0 0 18px}
  .gate-card input{width:100%;height:42px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);color:var(--tx);font-family:var(--mono);font-size:15px;padding:0 12px;letter-spacing:.1em}
  .gate-card input:focus{outline:none;border-color:var(--amber)}
  .gate-card button{width:100%;height:42px;margin-top:12px;background:var(--amber);color:#1a1206;border:none;border-radius:var(--r);font-weight:600;font-size:14px;cursor:pointer}
  .gate-card button:hover{filter:brightness(1.05)}
  .gate-err{color:var(--down);font-size:12px;margin-top:10px;min-height:16px}

  /* ---------- shell ---------- */
  #app{display:none;max-width:1440px;margin:0 auto;padding:0 20px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand .mark{font-family:var(--mono);font-weight:800;letter-spacing:.06em;font-size:26px;text-transform:uppercase;
    background:linear-gradient(90deg,#f5a623 0%,#ffd479 22%,#58a6ff 50%,#ffd479 78%,#f5a623 100%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    animation:mm-sheen 7s linear infinite}
  @keyframes mm-sheen{to{background-position:200% center}}
  @media (prefers-reduced-motion:reduce){.brand .mark{animation:none}}
  .brand .sub{color:var(--tx3);font-size:12px;letter-spacing:.04em}
  .topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .vintage{font-family:var(--mono);font-size:11px;color:var(--tx3);text-align:right;line-height:1.5}
  .vintage b{color:var(--tx2);font-weight:500}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:var(--r);padding:3px}
  .seg button{background:none;border:none;color:var(--tx2);font-family:var(--mono);font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer}
  .seg button.on{background:var(--raise);color:var(--tx)}

  .regime{display:flex;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
  .regime .cell{flex:1;min-width:150px;background:var(--panel);padding:11px 14px}
  .regime .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:3px}
  .regime .val{font-size:13.5px;font-weight:600}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
  .tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--tx2);font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 16px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
  .tabs button.on{color:var(--tx);border-bottom-color:var(--amber)}
  .tabs button:hover{color:var(--tx)}

  .panel{display:none}
  .panel.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  h2.sec{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--tx2);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec:first-child{margin-top:4px}
  h2.sec .tag{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--tx3);text-transform:none;letter-spacing:0;background:var(--panel2);border:1px solid var(--border);padding:2px 7px;border-radius:5px}

  /* KPI cards */
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 16px}
  .kpi .k-lbl{font-size:11.5px;color:var(--tx2);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .kpi .k-lbl .en{color:var(--tx3);font-family:var(--mono);font-size:10px}
  .kpi .k-val{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1;letter-spacing:-.01em}
  .kpi .k-val .u{font-size:14px;color:var(--tx2);font-weight:500;margin-left:2px}
  .kpi .k-row{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
  .kpi .k-item{font-size:11px;color:var(--tx3)}
  .kpi .k-item b{font-family:var(--mono);font-weight:600;font-size:12px;display:block;margin-top:1px}
  .pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .pill.up{background:var(--up-d);color:var(--up)} .pill.dn{background:var(--down-d);color:var(--down)}
  .pill.am{background:var(--amber-d);color:var(--amber)} .pill.nt{background:var(--panel2);color:var(--tx2)} .pill.in{background:var(--info-d);color:var(--info)}
  .pos{color:var(--up)} .neg{color:var(--down)} .amb{color:var(--amber)} .muted{color:var(--tx3)}

  /* tables */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
  th,td{padding:10px 14px;text-align:right;font-size:13px;border-bottom:1px solid var(--border)}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600;background:var(--panel2)}
  th:first-child,td:first-child{text-align:left}
  td.name{color:var(--tx)} td .nt2{color:var(--tx3);font-size:11px;display:block}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .ta-wrap{overflow-x:auto}
  .ta-wrap table{min-width:640px}
  .ta-i1{padding-left:30px!important}.ta-i2{padding-left:48px!important}.ta-i3{padding-left:66px!important}
  tr.ta-agg td{font-weight:600}
  td.ta-neg{color:#3fb950}

  .chartbox{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
  .chartbox .ch-title{font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:4px}
  .chartbox .ch-note{font-size:10.5px;color:var(--tx3);margin-bottom:12px}
  .cwrap{position:relative;width:100%}

  .note{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;font-size:12.5px;color:var(--tx2);line-height:1.6}
  .note b{color:var(--tx)}
  .synth{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;font-size:13.5px;line-height:1.7;color:var(--tx2)}
  .synth b{color:var(--tx)}
  .synth .hdr{font-size:13px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-family:var(--mono)}

  .cal{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  .cal .ev{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
  .cal .ev .nm{font-size:13px;font-weight:600} .cal .ev .nm span{display:block;font-size:11px;color:var(--tx3);font-weight:400}
  .cal .ev .dt{font-family:var(--mono);font-size:12.5px;color:var(--amber);text-align:right}
  .cal .ev .dt span{display:block;font-size:10px;color:var(--tx3)}

  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--tx3);line-height:1.7}
  footer code{font-family:var(--mono);color:var(--tx2);background:var(--panel2);padding:1px 5px;border-radius:4px}

  @media (max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.cal{grid-template-columns:1fr}.regime .cell{min-width:48%}}
  @media (max-width:520px){.g2,.g4{grid-template-columns:1fr}.kpi .k-val{font-size:24px}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="mark">Macro Monitor</div>
    <h1 id="g-title">Restricted research terminal</h1>
    <p id="g-sub">Enter access key to continue.</p>
    <input id="g-input" type="password" autocomplete="off" inputmode="numeric" placeholder="••••••••" />
    <button id="g-btn">Unlock</button>
    <div class="gate-err" id="g-err"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">Macro Monitor</span>
      <span class="sub" id="b-sub">CPI · Jobs · PCE</span>
    </div>
    <div class="topright">
      <div class="vintage" id="vintage"></div>
      <div class="seg">
        <button data-lang="en" class="on" onclick="setLang('en')">EN</button>
        <button data-lang="tc" onclick="setLang('tc')">繁</button>
      </div>
    </div>
  </div>

  <div class="regime" id="regime"></div>

  <div class="tabs" id="tabs"></div>

  <section class="panel" id="p-overview"></section>
  <section class="panel" id="p-liq"></section>
  <section class="panel" id="p-cpi"></section>
  <section class="panel" id="p-ppi"></section>
  <section class="panel" id="p-jobs"></section>
  <section class="panel" id="p-pce"></section>

  <footer id="footer"></footer>
</div>

<script>
/* ============================================================
   ACCESS GATE — SHA-256 via crypto.subtle only; no plaintext.
   ============================================================ */
const PW_HASH = "bebc79734038e684e2d9bd00f8a0bcebb96fbffbdb699ffd076732806fe1cde0";
async function sha256(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function tryUnlock(){
  const v = document.getElementById("g-input").value.trim();
  const err = document.getElementById("g-err");
  try{
    if((await sha256(v)) === PW_HASH){
      sessionStorage.setItem("mm_ok","1");
      reveal();
    }else{ err.textContent = LANG==="tc" ? "存取金鑰錯誤" : "Incorrect access key."; }
  }catch(e){ err.textContent = "Secure context required (use the https:// URL)."; }
}
function reveal(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  renderAll();
}
document.getElementById("g-btn").addEventListener("click", tryUnlock);
document.getElementById("g-input").addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });

function pendTag(){ return ' <span class="pill nt">'+t("pending")+'</span>'; }

/* surprise classification: dir = "inflation" (higher=hot) or "jobs" (higher=beat) */
function surprise(actual,cons,dir){
  if(actual===null||cons===null||actual===undefined||cons===undefined) return {cls:"nt",txt:"—",d:null};
  const d=+(actual-cons).toFixed(1);
  if(Math.abs(d)<0.05) return {cls:"nt",txt:t("inline"),d:0};
  if(dir==="jobs") return d>0?{cls:"up",txt:t("beat"),d}:{cls:"dn",txt:t("miss"),d};
  return d>0?{cls:"dn",txt:t("hot"),d}:{cls:"up",txt:t("cool"),d};
}

        kitem(t("prior"),"+"+j.nfp.prior+"K")+kitem(t("cons"),"+"+j.nfp.cons+"K")+kitem(L("3m avg","3月均"),"+"+j.nfp.ann3m+"K"))
    + kpi(L("Unemployment","失業率"),"U-3",

  const wc=j.worldCup;
  // World Cup note — phase-aware (pre / during / post the Jun 11–Jul 19 tournament),
  // keyed to the jobs reference month; manual.json worldCupNote overrides when set;
  // hides itself after Oct 2026 when the distortion has washed out.
  const wcNote=(function(){
    if(wc.note&&(wc.note.en||wc.note.tc)) return '<div class="note"><b>'+L("World Cup distortion.","世界盃扭曲。")+'</b> '+L(wc.note.en||wc.note.tc,wc.note.tc||wc.note.en)+'</div>';
    const MI={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const pr=(DATA.meta.asof.jobs||"").split(" ");
    const cur=(pr.length===2&&MI[pr[0]]!==undefined)?(+pr[1])*12+MI[pr[0]]:null;
    const JUN=2026*12+5, JUL=JUN+1, OCT=2026*12+9;
    if(cur===null||cur>OCT) return "";
    const lh=wc.lhTotal, tr=wc.lhTrend, ex=wc.exLH, sg=v=>(v>0?"+":"")+v;
    const exEn = ex===null?"" : ex>=100?" Ex-L&H, payrolls rose <b>+"+ex+"K</b> — hiring outside the sector held up."
      : ex>=50?" Ex-L&H, payrolls rose <b>+"+ex+"K</b> — moderating but positive."
      : ex>=0?" Ex-L&H, payrolls rose just <b>+"+ex+"K</b> — the softness extends beyond the World Cup."
      :" Ex-L&H, payrolls fell <b>"+ex+"K</b> — the weakness extends well beyond the World Cup.";
    const exTc = ex===null?"" : ex>=100?"扣除 L&H 後就業仍增 <b>+"+ex+"K</b>——其他行業招聘尚穩。"
      : ex>=50?"扣除 L&H 後增 <b>+"+ex+"K</b>——放緩但仍正向。"
      : ex>=0?"扣除 L&H 後僅增 <b>+"+ex+"K</b>——疲軟不止於世界盃因素。"
      :"扣除 L&H 後減少 <b>"+ex+"K</b>——疲軟遠超世界盃因素。";
    let en,tc;
    if(cur<JUN){
      en="Leisure & hospitality added <b>"+sg(lh)+"K</b> vs a ~"+tr+"K trend — pre-tournament hiring (BofA's \u201cWorld Cup fever\u201d)."+exEn+" Expect noisy Jun/Jul prints (tournament Jun 11–Jul 19) and an H2 give-back as temp roles roll off — don't extrapolate the 3-month trend.";
      tc="休閒與酒店業增加 <b>"+sg(lh)+"K</b>（趨勢約 "+tr+"K）——賽前提前招聘（美銀稱「世界盃熱」）。"+exTc+"預期 6–7 月數據受干擾（賽事 6/11–7/19），下半年臨時職位退場將回吐——勿外推 3 個月趨勢。";
    } else if(cur<=JUL){
      if(lh<tr-10){
        en="The distortion has flipped sign: L&H swung to <b>"+lh+"K</b> vs a ~"+tr+"K trend even with the tournament running (Jun 11–Jul 19) — BLS flags weaker-than-usual seasonal hiring, i.e. the spring pull-forward is now being given back through seasonal adjustment."+exEn+" Expect continued noise through the Jul–Aug prints; judge the trend ex-L&H, not on the headline.";
        tc="扭曲方向已反轉：賽事進行中（6/11–7/19），L&H 轉為 <b>"+lh+"K</b>（趨勢約 "+tr+"K）——BLS 指季節性招聘弱於往常，即春季提前招聘正透過季調回吐。"+exTc+"7–8 月數據仍將受干擾；以扣除 L&H 的趨勢判斷勞動市場，勿只看頭條。";
      } else if(lh>tr+10){
        en="L&H added <b>+"+lh+"K</b> vs a ~"+tr+"K trend with the tournament underway (Jun 11–Jul 19) — a temporary boost."+exEn+" Expect an H2 give-back as temp roles roll off — don't extrapolate.";
        tc="賽事進行中（6/11–7/19），L&H 增加 <b>+"+lh+"K</b>（趨勢約 "+tr+"K）——屬暫時性提振。"+exTc+"下半年臨時職位退場將回吐——勿外推。";
      } else {
        en="L&H printed <b>"+sg(lh)+"K</b>, near its ~"+tr+"K trend, with the tournament underway (Jun 11–Jul 19) — pull-forward and tournament boost roughly offsetting."+exEn;
        tc="賽事進行中（6/11–7/19），L&H 為 <b>"+sg(lh)+"K</b>、接近約 "+tr+"K 趨勢——提前招聘與賽事提振大致相抵。"+exTc;
      }
    } else {
      en="Tournament ended Jul 19; L&H printed <b>"+sg(lh)+"K</b> vs a ~"+tr+"K trend as temp roles roll off."+exEn+" The distortion washes out of the 3-month trend by late autumn.";
      tc="賽事已於 7/19 結束；L&H 為 <b>"+sg(lh)+"K</b>（趨勢約 "+tr+"K），臨時職位陸續退場。"+exTc+"扭曲將於秋末自 3 個月趨勢中淡出。";
    }
    return '<div class="note"><b>'+L("World Cup distortion.","世界盃扭曲。")+'</b> '+L(en,tc)+'</div>';
  })();

  const rev=j.revisions.map(x=>{
    const d=x.r-x.i;
    return '<tr><td class="name">'+x.m+'</td><td class="num muted">+'+x.i+'K</td><td class="num">+'+x.r+'K</td><td class="num '+(d>=0?"pos":"neg")+'">'+(d>0?"+":"")+d+'K</td></tr>';
  }).join("");

  const jo=j.jolts;
  const joKpis='<div class="grid g4">'
    + kpi(L("Job openings","職位空缺"),"JOLTS · "+jo.asof, jo.openings.toFixed(1)+'<span class="u">M</span>',"")
    + kpi(L("Quits rate","主動離職率"),"quits/employment", pct(jo.quitsRate),kitem(L("Quits","離職"),jo.quits.toFixed(1)+"M"))
    + kpi(L("Hires","聘僱"),"JOLTS", jo.hires.toFixed(1)+'<span class="u">M</span>',"")
    + kpi(L("Separations","離職總數"),"JOLTS", jo.separations.toFixed(1)+'<span class="u">M</span>',"")
    +'</div>';

  document.getElementById("p-jobs").innerHTML =
    '<h2 class="sec">'+L("Headline figures","頭條數據")+' <span class="tag">'+DATA.meta.asof.jobs+'</span></h2>'+kpis
    + wcNote
    +'<h2 class="sec">'+L("Payroll change by industry","各行業就業變動")+' <span class="tag">'+L("MoM, 000s, SA","月增, 千人, 季調")+'</span></h2>'
    +'<div class="chartbox"><div class="ch-title">'+L("May 2026 sector waterfall","2026 年 5 月行業瀑布圖")+'</div>'
    +'<div class="ch-note">'+L("Green = gain · gray = little changed · coral = loss","綠 = 增加 · 灰 = 變動不大 · 珊瑚 = 減少")+'</div>'
    +'<div class="cwrap" style="height:430px"><canvas id="ch-sect" role="img" aria-label="Bar chart of job change by sector for May 2026"></canvas></div></div>'
    +'<h2 class="sec">'+L("Revisions tracker","修正追蹤")+'</h2>'
    +'<table><thead><tr><th>'+L("Month","月份")+'</th><th>'+L("Initial","初值")+'</th><th>'+L("Revised","修正後")+'</th><th>'+L("Net","淨")+'</th></tr></thead><tbody>'+rev+'</tbody></table>'
    +'<h2 class="sec">'+L("Turnover (JOLTS)","勞動流動 (JOLTS)")+' <span class="tag">'+L("low-hire / low-fire","低聘僱 / 低裁員")+'</span></h2>'+joKpis
    +'<h2 class="sec">'+L("Payroll trajectory","非農走勢")+'</h2>'
    +'<div class="chartbox"><div class="ch-title">'+L("Nonfarm payroll change, 000s","非農就業變動（千人）")+'</div>'
    +'<div class="ch-note">'+L("Recent prints incl. revisions; full history backfills from FRED.","近期數據（含修正）；完整歷史由 FRED 回補。")+'</div>'
    +'<div class="cwrap" style="height:240px"><canvas id="ch-nfp" role="img" aria-label="Bar chart of nonfarm payroll change by month"></canvas></div></div>';
}

  if(panelId==="p-ppi"){

      mk("ch-ppi",{type:"line",data:{labels:pp.series.labels,datasets:[
        {label:L("Final demand","最終需求"),data:pp.series.headline,borderColor:"#f5a623",backgroundColor:"#f5a623",tension:.25,borderWidth:2,pointRadius:3},

    const p=DATA.pce, n=p.series.labels.length;

      {label:"Headline",data:p.series.headline,borderColor:"#f5a623",backgroundColor:"#f5a623",tension:.25,borderWidth:2,pointRadius:3},
      {label:"Core",data:p.series.core,borderColor:"#58a6ff",backgroundColor:"#58a6ff",borderDash:[5,4],tension:.25,borderWidth:2,pointRadius:3},

// Inline crosshair: vertical guide line at the hovered index (no external plugin).
if(typeof Chart!=="undefined" && !Chart.__mmCross){
  Chart.register({id:"mmCrosshair",
    afterDraw(chart){
      const t=chart.tooltip; if(!t||!t.getActiveElements||!t.getActiveElements().length) return;
      const x=t.getActiveElements()[0].element.x, ya=chart.chartArea;
      const ctx=chart.ctx; ctx.save();
      ctx.beginPath(); ctx.moveTo(x,ya.top); ctx.lineTo(x,ya.bottom);
      ctx.lineWidth=1; ctx.strokeStyle="rgba(230,237,243,.35)"; ctx.setLineDash([4,3]); ctx.stroke();
      ctx.restore();
    }});
  Chart.__mmCross=true;
}
